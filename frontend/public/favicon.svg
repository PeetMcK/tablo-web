  <!-- The app's stadium TV mark, on its native 24x24 grid — the same geometry as
       the header logo in ChannelGrid.tsx, so the two cannot drift apart. Sized to
       fill ~70% of the tile: (512 - 24*15) / 2 = 76 centres the 24-unit grid, and
       the extra 2 off the y translate lifts the glyph by the eighth of a unit its
       inked box sits below centre (it runs y 2 to 22.25, not 1.875 to 22.125). -->
  <g transform="translate(76 74) scale(15)"
     fill="none" stroke="#fff" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.25" y="3.25" width="19.5" height="13.5" rx="6.75"/>
    <path d="M12 17v4"/>
    <path d="M8 21h8"/>
  </g>
</svg>
