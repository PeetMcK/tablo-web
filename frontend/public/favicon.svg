<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tablo-Web">
  <!-- The app's own brand mark, lifted from the header in ChannelGrid.tsx so the
       tab icon and the logo above it cannot drift apart: same gradient, same
       glyph, same geometry. -->
  <defs>
    <!-- linear-gradient(135deg, ...) in CSS runs top-left to bottom-right. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8af5"/>
      <stop offset="1" stop-color="#7c5bf5"/>
    </linearGradient>
  </defs>
  <!-- Squircle rather than the header's rounded rect: the superellipse
       |x|^5 + |y|^5 = 1, sampled in polar form and fitted with cubic Beziers,
       so curvature runs continuously into the straight edges instead of meeting
       them at the seam a fixed corner radius leaves. Polar because the usual
       trig parametrization has an infinite derivative on the axes, which throws
       the control points to five figures and turns the shape inside out. -->
